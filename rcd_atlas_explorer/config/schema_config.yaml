database:
  path: data/processed/rcd_atlas.duckdb
  parquet_dir: data/processed/rcd_atlas.parquet
  exports_dir: data/exports
  use_demo_if_no_raw: true

year:
  min_expected: 2000
  max_expected: 2025

logical_tables:
  articles:
    filename_patterns:
      - "*article_metadata*.csv"
      - "*article_meta*.csv"
      - "articles.csv"
      - "article_metadata.csv"
      - "demo_articles.csv"
      - "*article*.tsv"
      - "articles.tsv"
    required_columns: [pmid]
    columns:
      pmid: [pmid, PMID]
      title: [title, ArticleTitle]
      journal: [journal, Journal]
      publication_year: [publication_year, pub_year, PubYear, year]
      publication_date: [publication_date, pub_date, date]
      doi: [doi, DOI]
      abstract: [abstract, Abstract]
      publication_types: [publication_types, PublicationTypes, publication_type]
      country: [country, Countries, JournalCountry, affiliation_country]
      evidence_stage: [evidence_stage, evidence_tier, translational_stage]
      high_stage_text_signal: [high_stage_text_signal]
      publicationtype_supported_trial: [publicationtype_supported_trial, trial_supported]
      is_oncology: [is_oncology, oncology_flag, is_neoplasm]
      tumor_family: [tumor_family]

  death_mode_disease_articles:
    filename_patterns:
      - "*pair_pmids*.csv"
      - "*pair_pmid_links*.csv"
      - "*article_stage*.csv"
      - "*death_mode_disease_articles*.csv"
      - "*death_disease_articles*.csv"
      - "*death*disease*pmid*.csv"
    required_columns: [pmid, death_mode, disease_term]
    columns:
      pmid: [pmid, PMID]
      death_mode: [death_mode, Death_Mode]
      disease_term: [disease_term, Disease]
      disease_system: [disease_system, Disease_Category]
      is_neoplasm: [is_neoplasm, oncology_flag, is_oncology]
      tumor_family: [tumor_family]
      evidence_stage: [evidence_stage, evidence_tier]
      pair_count: [pair_count, Pair_Count]

  death_mode_disease_pairs:
    filename_patterns:
      - "*death_disease_pairs*.csv"
      - "*pair_metrics*.csv"
      - "*death*disease*pair*.csv"
    required_columns: [death_mode, disease_term]
    columns:
      death_mode: [death_mode, Death_Mode]
      disease_term: [disease_term, Disease]
      disease_system: [disease_system, Disease_Category]
      is_neoplasm: [is_neoplasm, oncology_flag, is_oncology]
      tumor_family: [tumor_family]
      pair_count: [pair_count, Pair_Count, Article_Count]
      unique_pmids: [unique_pmids, Article_Count, PMID_Count, pmid_count]
      first_year: [first_year, First_Year]
      latest_year: [latest_year, last_year, Latest_Year]
      literature_hub_score: [literature_hub_score, Disease_Specificity_Score, disease_hub_score]
      selectivity_score: [selectivity_score, Death_Selectivity_Score]

  gene_mentions:
    filename_patterns:
      - "*gene_matches_accepted*.csv"
      - "*gene_comention_matches_primary*.csv"
      - "*gene_mentions*.csv"
      - "*pubtator_gene_annotations_normalized*.csv"
      - "*dictionary_gene_matches*.csv"
    required_columns: [pmid, gene_symbol]
    columns:
      pmid: [pmid, PMID]
      gene_symbol: [gene_symbol, official_symbol, symbol, shared_display_symbol, human_symbol]
      gene_alias: [gene_alias, matched_text, gene_mention_text, matched_term]
      source_field: [source_field, match_field]
      matched_text: [matched_text, gene_mention_text, matched_term]
      context_sentence: [context_sentence, match_sentence, sentence_text_if_available, match_sentence_or_snippet]
      death_mode: [death_mode]
      disease_term: [disease_term]
      disease_system: [disease_system]
      evidence_stage: [evidence_stage, evidence_tier]
      is_oncology: [is_oncology, oncology_flag]
      tumor_family: [tumor_family]
      artifact_flag: [artifact_flag]

  gene_death_disease_articles:
    filename_patterns:
      - "*gene_death_disease_pmid_links*.csv"
      - "*gene_death_disease_articles*.csv"
      - "*gene_death_relation_sentences*.csv"
      - "*gene_matches_accepted*.csv"
      - "*gene_comention_matches_primary*.csv"
    required_columns: [pmid, gene_symbol]
    columns:
      pmid: [pmid, PMID]
      gene_symbol: [gene_symbol, official_symbol, symbol, shared_display_symbol, human_symbol]
      gene_alias: [gene_alias, matched_text, gene_mention_text, matched_term]
      death_mode: [death_mode]
      disease_term: [disease_term]
      disease_system: [disease_system]
      is_oncology: [is_oncology, oncology_flag]
      tumor_family: [tumor_family]
      source_field: [source_field, match_field, annotation_source]
      context_sentence: [context_sentence, sentence, match_sentence, sentence_text_if_available, match_sentence_or_snippet]
      evidence_stage: [evidence_stage, evidence_tier]
      artifact_flag: [artifact_flag]

  drug_mentions:
    filename_patterns:
      - "*oncology_drug_mentions*.csv"
      - "*approved_clinical_drug*_contexts*.csv"
      - "*pubmed_pubtator_approved_clinical_drug*.csv"
      - "*drug_mentions*.csv"
      - "*pubmed_mesh_chemical_annotations*.csv"
      - "*pubtator_chemical_annotations*.csv"
    required_columns: [pmid]
    columns:
      pmid: [pmid, PMID]
      drug_name: [drug_name, drug_display, mention_text, chemical_name]
      normalized_drug_name: [normalized_drug_name, drug_normalized, drug_name, drug_display]
      reference_class_label: [reference_class_label, reference_class, therapy_class]
      approved_clinical_drug_flag: [approved_clinical_drug_flag, approved_flag]
      fda_approved_flag: [fda_approved_flag]
      source: [source, mention_source, evidence_sources]
      relation_cue: [relation_cue, cue_word, relation_category]
      relation_sentence: [relation_sentence, mention_sentence_if_available, sentence]
      negation_flag: [negation_flag]
      token_distance: [token_distance, drug_death_distance_tokens]
      relation_confidence: [relation_confidence, confidence_high_medium_low, mapping_confidence]
      death_mode: [death_mode]
      disease_term: [disease_term]
      tumor_family: [tumor_family]
      evidence_stage: [evidence_stage, evidence_tier]

  drug_death_disease_articles:
    filename_patterns:
      - "*oncology_drug_mentions_evidence_merged*.csv"
      - "*approved_clinical_drug*_contexts*.csv"
      - "*pubmed_pubtator_approved_clinical_drug*.csv"
      - "*drug_death_relation_sentences*.csv"
      - "*drug_death_disease_articles*.csv"
      - "*oncology_drug_mentions*.csv"
    required_columns: [pmid]
    columns:
      pmid: [pmid, PMID]
      normalized_drug_name: [normalized_drug_name, drug_normalized, drug_name, drug_display]
      drug_name: [drug_name, drug_display, mention_text]
      death_mode: [death_mode]
      disease_term: [disease_term]
      tumor_family: [tumor_family]
      reference_class_label: [reference_class_label, reference_class, therapy_class]
      approved_clinical_drug_flag: [approved_clinical_drug_flag, approved_flag]
      fda_approved_flag: [fda_approved_flag]
      relation_cue: [relation_cue, cue_word, relation_category]
      relation_sentence: [relation_sentence, sentence, mention_sentence_if_available]
      negation_flag: [negation_flag]
      token_distance: [token_distance, drug_death_distance_tokens]
      relation_confidence: [relation_confidence, confidence_high_medium_low, mapping_confidence]
      evidence_stage: [evidence_stage, evidence_tier]

  disease_dictionary:
    filename_patterns:
      - "*disease_dictionary*.csv"
      - "*disease_system_mapping*.csv"
      - "*disease_terms_cleaned*.csv"
    required_columns: [disease_term]
    columns:
      disease_term: [disease_term, Disease, disease]
      disease_id: [disease_id, mesh_id, MeSH_ID]
      disease_system: [disease_system, Disease_Category]
      is_neoplasm: [is_neoplasm, oncology_flag, is_oncology]
      tumor_family: [tumor_family]
      synonyms: [synonyms, aliases]

  synonyms:
    filename_patterns:
      - "*synonym*.csv"
      - "*alias*.csv"
    required_columns: [entity_type, canonical_name, synonym]
    columns:
      entity_type: [entity_type]
      canonical_name: [canonical_name, official_symbol]
      synonym: [synonym, alias, matched_text]
